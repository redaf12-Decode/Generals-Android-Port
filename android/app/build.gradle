plugins {
    id 'com.android.application'
}

// GeneralsX @bugfix Android security 10/11/2026 Signing material is read from
// the environment (what CI injects from GitHub Actions secrets) or from Gradle
// properties (-Pgx... / a local, gitignored keystore.properties), never from a
// file in this repository. The committed android/app/debug.keystore and its
// well-known password were removed: a keystore in a public repository is a
// compromised key, because anyone can sign an APK Android accepts as an update
// to this app.
//
// GeneralsX @feature Android security 12/11/2026 Local development: the same four
// values may live in a gitignored android/keystore.properties (GX_RELEASE_* names),
// so a developer never exports environment variables or edits this file. CI still
// supplies them through the environment (secrets). The lookup order is
// environment -> keystore.properties -> -P property, and nothing here has a
// default: a release with any of the four missing is refused (see the task guard
// at the bottom of this file).
def gxSigningProps = new Properties()
def gxSigningPropsFile = rootProject.file('keystore.properties')
if (gxSigningPropsFile.isFile()) {
    gxSigningPropsFile.withInputStream { gxSigningProps.load(it) }
}
def gxSigningValue = { String envName, String propName ->
    System.getenv(envName) ?: gxSigningProps.getProperty(envName) ?: project.findProperty(propName)
}
def gxReleaseStoreFile = gxSigningValue('GX_RELEASE_STORE_FILE', 'gxReleaseStoreFile')
def gxReleaseStorePassword = gxSigningValue('GX_RELEASE_STORE_PASSWORD', 'gxReleaseStorePassword')
def gxReleaseKeyAlias = gxSigningValue('GX_RELEASE_KEY_ALIAS', 'gxReleaseKeyAlias')
def gxReleaseKeyPassword = gxSigningValue('GX_RELEASE_KEY_PASSWORD', 'gxReleaseKeyPassword')
// GeneralsX @feature Android security 12/11/2026 Optional: the SHA-256 of the expected signing
// certificate, colon-separated uppercase hex as `keytool -list -v` prints it. When set, the
// release build verifies its own signing certificate against it (see the guard at the bottom),
// so a build signed with the wrong key fails here rather than after it is published.
def gxReleaseCertSha256 = gxSigningValue('GX_RELEASE_CERT_SHA256', 'gxReleaseCertSha256')
// All four release values are required together; a partial set is a misconfiguration, not a
// fallback.
def gxReleaseConfigured = [gxReleaseStoreFile, gxReleaseStorePassword, gxReleaseKeyAlias,
                           gxReleaseKeyPassword].every { it }
// A debug keystore may still be supplied (CI needs a stable debug key so
// consecutive debug builds install over each other); it too comes from the
// environment, never from the repository.
def gxDebugStoreFile = System.getenv('GX_DEBUG_KEYSTORE') ?: gxSigningProps.getProperty('GX_DEBUG_KEYSTORE') ?: project.findProperty('gxDebugKeystore')
def gxDebugStorePassword = System.getenv('GX_DEBUG_STORE_PASSWORD') ?: gxSigningProps.getProperty('GX_DEBUG_STORE_PASSWORD') ?: project.findProperty('gxDebugStorePassword')
def gxDebugKeyAlias = System.getenv('GX_DEBUG_KEY_ALIAS') ?: gxSigningProps.getProperty('GX_DEBUG_KEY_ALIAS') ?: project.findProperty('gxDebugKeyAlias')
def gxDebugKeyPassword = System.getenv('GX_DEBUG_KEY_PASSWORD') ?: gxSigningProps.getProperty('GX_DEBUG_KEY_PASSWORD') ?: project.findProperty('gxDebugKeyPassword')

android {
    namespace 'com.ports.generalsx'
    compileSdk 35

    signingConfigs {
        // Only declared when a real keystore was supplied; otherwise AGP falls
        // back to its own auto-generated debug keystore for the debug build
        // type, and the release build fails loudly (see buildTypes.release).
        if (gxDebugStoreFile) {
            debug {
                storeFile file(gxDebugStoreFile)
                storePassword gxDebugStorePassword
                keyAlias gxDebugKeyAlias
                keyPassword gxDebugKeyPassword
            }
        }
        if (gxReleaseConfigured) {
            release {
                storeFile file(gxReleaseStoreFile)
                storePassword gxReleaseStorePassword
                keyAlias gxReleaseKeyAlias
                keyPassword gxReleaseKeyPassword
                // The production keystore is a JKS/PKCS12 container; AGP detects the type from
                // the file. enableV1/V2/V3 are AGP defaults (v1 on for minSdk<24 only, v2 and v3
                // on), which is what a modern release wants: v2/v3 is what the launcher's own
                // ApkInstaller certificate check and Android 9+ require.
            }
        }
    }

    defaultConfig {
        // GeneralsX @tweak Android port 08/11/2026 The applicationId (the id the OS, the Play
        // Store and other apps see) is 'com.ports.generalsx'. GeneralsX @refactor Android port
        // 12/11/2026 The Java namespace now matches it: the sources live under
        // java/com/ports/generalsx/ and the manifest .Name references resolve to it. The
        // applicationId, the native paths in Core/GameEngine/Include/Common/GXAndroidApp.h and
        // the comments in scripts/build/android/package-android-zh.sh name the id, and all must
        // agree -- see GXAndroidApp.h for why the native side builds those paths by hand.
        applicationId 'com.ports.generalsx'
        // API 28 (Android 9): floor that still covers the Redmi Note 8 Pro
        // line while giving bionic glob(3) and stable Vulkan loader behavior.
        // The real graphics gate is the GPU driver, not the OS version — see
        // docs/port/ANDROID_PORT.md (DXVK 2.6 needs Vulkan 1.3).
        //
        // GeneralsX @build Android port launcher-ui-2026 08/09/2026 Audited for
        // a drop to 24 (Android 7.0) while modernising the launcher UI, and
        // deliberately NOT lowered. The launcher's own Java is clean at 24 —
        // `gradle :app:lintDebug` with minSdk 24 reports zero NewApi findings
        // anywhere under java/com/ports/generalsx/ (the one API-30 call,
        // Environment.isExternalStorageManager() in onSelectGameFolder(), is
        // already behind a SDK_INT >= R gate, and FeatureInfo.version /
        // Comparator.comparing() are both exactly API 24). Two things outside
        // this file block it:
        //
        //   1. The native side is built against android-28 — see
        //      CMakePresets.json's android-vulkan preset (ANDROID_PLATFORM
        //      "android-28") and cmake/triplets/arm64-android.cmake, which pins
        //      every vcpkg dependency to the same level. An APK declaring 24
        //      would install on Android 7/8 and then fail to dlopen its own
        //      libraries. Changing that is a native/CMake decision, not a
        //      launcher one.
        //   2. SDL's own staged Java (src/main/java-sdl, regenerated by
        //      scripts/build/android/package-android-zh.sh) calls
        //      InputDevice#isExternal (API 29) unguarded in
        //      SDLControllerManager.java — a fatal NewApi lint error at
        //      minSdk 24, in a file this repo does not own.
        //
        // The launcher UI is written to the API 24 surface regardless, so if
        // both of the above are ever resolved, this line is the only change
        // needed here.
        minSdk 28
        targetSdk 35
        // GeneralsX @feature Android port 08/07/2026 Version numbers are
        // manually managed from here on -- CI no longer auto-bumps versionCode
        // from the workflow run number on every push. Bump these two values
        // by hand when you actually want to ship a new version; -PandroidVersionCode=N
        // / -PandroidVersionName=X.Y.Z (wired from the "Build Android" workflow's
        // manual-dispatch inputs) can still override them for one-off CI builds
        // without touching this file. versionCode must strictly increase for
        // Android to accept installing one APK "over" another via a normal tap
        // install (adb install -r doesn't care) -- keep it above whatever is
        // already on your device.
        // Scheme: versionCode = major*10000 + minor*100 + patch, so the
        // number always sorts the same way as versionName (1.2.0 -> 10200).
        versionCode (project.hasProperty('androidVersionCode') ? (project.androidVersionCode as Integer) : 10402)
        versionName (project.hasProperty('androidVersionName') ? project.androidVersionName : '1.4.2')
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // Both directories are STAGED by scripts/build/android/package-android-zh.sh
            // (gitignored): jniLibs/ receives the CMake-built .so set, java-sdl/
            // receives org/libsdl/app/*.java from the in-tree SDL3 source so the
            // shell always matches the exact SDL version the game linked.
            java.srcDirs += 'src/main/java-sdl'
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Small runtime files bundled into the APK, staged by the packaging
            // script: assets/gamedata/ (fonts/, dxvk.conf, DefaultOptions.ini)
            // is extracted to the external files dir on first launch;
            // assets/default_driver/ (fallback Turnip build, see
            // SetupActivity.applyRecommendedDriverIfNeeded()) is extracted to
            // app-private internal storage only on Adreno phones that need it.
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        debug {
            // GeneralsX @bugfix Android security 10/11/2026 The debug build no
            // longer forces the removed in-repo key. When GX_DEBUG_KEYSTORE is
            // set the signingConfigs.debug block above provides a stable key;
            // otherwise AGP's own per-machine debug keystore signs it.
            if (gxDebugStoreFile) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            // GeneralsX @feature Android security 10/11/2026 A release is a
            // production artifact: not debuggable, and signed with the
            // production key. R8 shrinking is left off deliberately -- the
            // launcher reaches engine entry points by JNI method name and by
            // resource name, neither of which a keep-rule set in this port has
            // been validated against; turning it on without that validation
            // would risk shipping a launcher whose engine never loads. The
            // release is still non-debuggable and separately signed, which is
            // what the security finding asked for.
            debuggable false
            minifyEnabled false
            // Null when no production key was supplied. The release packaging
            // tasks below then fail with a clear message, rather than emitting
            // an unsigned -- or worse, debug-signed -- "release".
            signingConfig gxReleaseConfigured ? signingConfigs.release : null
        }

        // GeneralsX @build Android CI 06/11/2026 Launcher-only variant, for CI that must not
        // build the C++ engine. It is the whole launcher -- every Activity, resource, asset and
        // translation, the fixed debug key and the production applicationId -- with every native
        // library stripped out by the androidComponents block below.
        //
        // initWith debug is what keeps it installable: same signingConfig, debuggable, and the
        // same applicationId, so `adb install -r` puts it over a normally-built APK and the
        // Setup screen opens straight away. Nothing here changes the debug or release variants;
        // it is a third, opt-in variant that only `assembleLauncherOnly` produces.
        launcherOnly {
            initWith debug
            // No minify: the point is to exercise the same classes the real APK ships.
            minifyEnabled false
        }
    }

    testOptions {
        // GeneralsX @build Android touch editor 05/11/2026 The toolbox and overlay build their row
        // labels from strings.xml, so a unit test that drives them needs the merged resources on
        // the classpath; without this Robolectric throws Resources$NotFoundException for every
        // label. It is the standard setting for testing views that read resources.
        unitTests.includeAndroidResources = true
        // GeneralsX @build Android port 07/11/2026 The Map Manager's export goes through
        // ContentResolver.openOutputStream(), which Robolectric backs with a ParcelFileDescriptor.
        // Closing one reflects into java.io.FileDescriptor.fd, which JDK 17+ refuses unless java.io
        // is opened to the unnamed module. A no-op where it is already open.
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
        }
    }

    packagingOptions {
        jniLibs {
            // GeneralsX @bugfix Android port 10/07/2026 libadrenotools (custom
            // Vulkan driver loading, cmake/adrenotools.cmake) hard-requires
            // uncompressed, on-disk native libraries: it installs its hook by
            // dlopen()ing .so files it expects to find at
            // ApplicationInfo.nativeLibraryDir, which is only populated with
            // real files when legacy packaging is on -- with it off, Android
            // reads .so's straight out of the APK and nativeLibraryDir isn't
            // a real, browsable directory. Costs a bit of APK size (no .so
            // compression) in exchange for that directory existing.
            useLegacyPackaging true

            // GeneralsX @bugfix Android port 18/07/2026 Do NOT let AGP's
            // stripReleaseDebugSymbols strip the DXVK libraries. Stripped
            // libdxvk_d3d8/d3d9.so crash mid-render with corrupted Vulkan
            // dispatch (SIGSEGV / stray dxvk::DxvkError escaping into the
            // engine's update loop as an "unrecognized exception" -> the
            // "Technical Difficulties" box the moment the 3D shell map scene
            // flushes its first frames). Root-caused and fix verified by the
            // sibling GeneralsX Android fork (tarek369/GeneralsZH-Android,
            // commit 23f73d1) on the same OnePlus Pad 2 hardware one of our
            // issue #2 reporters uses: backtrace lands in the DX8 draw path
            // (DX8Wrapper::Draw -> SortingRendererClass::Flush_Sorting_Pool ->
            // RTS3DScene::Flush -> libdxvk_d3d9.so, fault addr 0x2000000001)
            // only when the libs are stripped; keeping symbols fixes it.
            keepDebugSymbols += ['**/libdxvk_d3d8.so', '**/libdxvk_d3d9.so']
        }
    }
}

// GeneralsX @feature Android security 10/11/2026 A release must never be
// produced without a production key. The check is a task-level action, not a
// configuration-time throw, so that debug builds, unit tests and lint (which a
// developer runs without any signing material) are unaffected while
// assembleRelease / bundleRelease / packageRelease fail immediately.
//
// GeneralsX @feature Android security 12/11/2026 The guard is stricter now: it
// fires when ANY of the four release values is missing (not merely the store
// file), and when GX_RELEASE_CERT_SHA256 is set it verifies the produced APK's
// own signing certificate against that fingerprint, so a build signed with the
// wrong key fails here instead of after publication. The fingerprint check uses
// the same apksigner that CI uses, resolved from the Android SDK the build is
// already using; a missing apksigner is a hard error, never a silent pass.
if (!gxReleaseConfigured) {
    tasks.matching { it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }.configureEach {
        doFirst {
            throw new GradleException(
                "Release signing is not configured. Set GX_RELEASE_STORE_FILE, " +
                "GX_RELEASE_STORE_PASSWORD, GX_RELEASE_KEY_ALIAS and GX_RELEASE_KEY_PASSWORD " +
                "(GitHub Actions secrets, or a local android/keystore.properties). " +
                "See docs/HOWTO/SIGNING_KEY_ROTATION.md.")
        }
    }
}

// GeneralsX @feature Android security 12/11/2026 Verify the release APK's signing certificate
// against GX_RELEASE_CERT_SHA256 when it is configured. Runs after packageRelease so it sees the
// final, signed artifact. The expected value is colon-separated uppercase hex, exactly what
// `keytool -list -v` prints; comparison is case-insensitive on the colons stripped.
if (gxReleaseCertSha256) {
    tasks.matching { it.name == 'packageRelease' }.configureEach {
        doLast {
            def apk = file("$buildDir/outputs/apk/release/app-release.apk")
            if (!apk.isFile()) {
                throw new GradleException("Release APK not found at ${apk}")
            }
            def sdkDir = android.sdkDirectory
            def buildTools = new File(sdkDir, 'build-tools')
            def apksigner = buildTools.listFiles()?.findAll { it.isDirectory() }
                ?.sort { it.name }?.reverse()?.collect { new File(it, 'apksigner') }
                ?.find { it.isFile() }
            if (apksigner == null) {
                throw new GradleException(
                    "apksigner not found under ${buildTools}; cannot verify the release certificate " +
                    "against GX_RELEASE_CERT_SHA256. Install Android build-tools or unset " +
                    "GX_RELEASE_CERT_SHA256.")
            }
            def out = new ByteArrayOutputStream()
            exec {
                commandLine apksigner.absolutePath, 'verify', '--print-certs', apk.absolutePath
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            def text = out.toString()
            if (!text.contains('Signer #1 certificate SHA-256 digest:')) {
                throw new GradleException("apksigner could not read the release APK's certificate:\n" + text)
            }
            def actual = (text =~ /Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F:]+)/)[0][1]
            def normalise = { String v -> v.replace(':', '').toUpperCase() }
            if (normalise(actual) != normalise(gxReleaseCertSha256)) {
                throw new GradleException(
                    "Release APK signing certificate does not match GX_RELEASE_CERT_SHA256.\n" +
                    "  expected: ${gxReleaseCertSha256}\n  actual:   ${actual}")
            }
            logger.lifecycle("Release APK certificate SHA-256 verified: ${actual}")
        }
    }
}

// GeneralsX @build Android CI 06/11/2026 Strip every native library from the launcherOnly
// variant. jniLibs/ is staged by scripts/build/android/package-android-zh.sh from the CMake
// build output; a CI job that only compiles Java has none of it, and the whole point of the
// variant is to prove the launcher runs with no engine behind it. Excluding here rather than
// by emptying jniLibs.srcDirs keeps the variant honest: if a .so ever does turn up it is
// still dropped, so the APK's contents do not depend on what happened to be staged.
androidComponents {
    onVariants(selector().withBuildType('launcherOnly')) { variant ->
        variant.packaging.jniLibs.excludes.add('**/*.so')
    }
}

dependencies {
    // Material Components for the Setup/Settings/Log-viewer screens only —
    // GeneralsZHActivity (the actual game surface) stays on its own plain
    // fullscreen theme and never touches these widgets.
    implementation 'com.google.android.material:material:1.12.0'

    // GeneralsX @bugfix Android port 11/07/2026 explicit dependency for
    // WindowInsetsCompat (InsetUtil.java) -- pulled in transitively by
    // Material already, but declared directly since we call its APIs.
    implementation 'androidx.core:core:1.13.1'

    // GeneralsX @build Android touch editor 05/11/2026 Unit tests for the touch-button model,
    // the shape geometry, the edit session and the key state machine. These are plain JVM tests
    // (Robolectric only where an Android class is unavoidable), so the editor's arithmetic is
    // checked without a device.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}

