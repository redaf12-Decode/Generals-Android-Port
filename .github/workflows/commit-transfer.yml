
name: Commit Transfer (Live Branch Selection)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "اسم فرع المصدر — انسخه من قائمة الفروع في سجل التشغيل"
        required: true
        type: string

      target_branch:
        description: "اسم الفرع المستهدف — انسخه من قائمة الفروع في سجل التشغيل"
        required: true
        type: string

      commit_sha:
        description: "رمز Commit الكامل (40 حرفًا)"
        required: true
        type: string

      confirm_main:
        description: "تأكيد الدفع المباشر إلى main عند اختياره"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: commit-transfer-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  list-branches:
    name: Discover actual repository branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.get-branches.outputs.branches }}

    steps:
      - name: Fetch actual branches from GitHub API
        id: get-branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches="$(gh api \
            --paginate \
            "repos/${REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | sort -u)"

          if [[ -z "$branches" ]]; then
            echo "::error::No branches were returned by the GitHub API."
            exit 1
          fi

          echo "Actual branches currently found in ${REPOSITORY}:"
          printf '%s\n' "$branches"

          {
            echo "## Branches currently present in the repository"
            echo
            printf '%s\n' "$branches" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Copy the exact source and target branch names into the workflow inputs."
          } >> "$GITHUB_STEP_SUMMARY"

          json="$(printf '%s\n' "$branches" | jq -R . | jq -s -c .)"
          echo "branches=$json" >> "$GITHUB_OUTPUT"

  transfer-commit:
    name: Validate and cherry-pick one commit
    needs: list-branches
    runs-on: ubuntu-latest

    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CONFIRM_MAIN: ${{ inputs.confirm_main }}
      AVAILABLE_BRANCHES: ${{ needs.list-branches.outputs.branches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate selected branches and commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::Source and target branches must be different."
            exit 1
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Enter a full 40-character commit SHA."
            exit 1
          fi

          if ! printf '%s' "$SOURCE_BRANCH" |
            jq -e --arg b "$SOURCE_BRANCH" \
              'index($b) != null' <<< "$AVAILABLE_BRANCHES" >/dev/null; then
            echo "::error::Source branch is not in the discovered branch list."
            exit 1
          fi

          if ! jq -e --arg b "$TARGET_BRANCH" \
            'index($b) != null' <<< "$AVAILABLE_BRANCHES" >/dev/null; then
            echo "::error::Target branch is not in the discovered branch list."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" == "main" && "$CONFIRM_MAIN" != "true" ]]; then
            echo "::error::Confirm direct transfer to main before continuing."
            exit 1
          fi

          echo "Branch and input validation passed."

      - name: Fetch and verify selected commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          if ! git cat-file -e "${COMMIT_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit does not exist in the fetched repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "$COMMIT_SHA" "refs/remotes/origin/${SOURCE_BRANCH}"; then
            echo "::error::Commit is not part of the selected source branch history."
            exit 1
          fi

          echo "Commit exists and belongs to the source branch history."

      - name: Create temporary branch from target
        shell: bash
        run: |
          set -euo pipefail

          TEMP_BRANCH="automation/commit-transfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "$TEMP_BRANCH" \
            "refs/remotes/origin/${TARGET_BRANCH}"

          echo "TEMP_BRANCH=$TEMP_BRANCH" >> "$GITHUB_ENV"

      - name: Cherry-pick selected commit
        shell: bash
        run: |
          set -euo pipefail

          if ! git cherry-pick "$COMMIT_SHA"; then
            git cherry-pick --abort || true
            echo "::error::Cherry-pick failed. No changes were pushed."
            exit 1
          fi

      - name: Push without force
        shell: bash
        run: |
          set -euo pipefail

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "Successfully transferred the selected commit."

      - name: Transfer summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Commit transfer successful"
            echo
            echo "- Source: \`${SOURCE_BRANCH}\`"
            echo "- Target: \`${TARGET_BRANCH}\`"
            echo "- Original commit: \`${COMMIT_SHA}\`"
            echo "- New commit: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
