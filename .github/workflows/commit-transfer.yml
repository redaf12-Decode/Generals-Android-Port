
name: Commit Transfer (Live Branch Selection)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "اسم فرع المصدر من قائمة الفروع في سجل التشغيل"
        required: true
        type: string

      target_branch:
        description: "اسم الفرع المستهدف من قائمة الفروع في سجل التشغيل"
        required: true
        type: string

      commit_sha:
        description: "رمز Commit الكامل (40 حرفًا)"
        required: true
        type: string

      confirm_main:
        description: "تأكيد الدفع المباشر إلى main"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: commit-transfer-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  list-branches:
    name: Discover repository branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.get-branches.outputs.branches }}

    steps:
      - name: Fetch actual branches from GitHub
        id: get-branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches="$(gh api --paginate \
            "repos/${REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | sort -u)"

          if [[ -z "$branches" ]]; then
            echo "::error::No branches found in the repository."
            exit 1
          fi

          echo "Branches currently present in ${REPOSITORY}:"
          printf '%s\n' "$branches"

          {
            echo "## Available repository branches"
            echo
            printf '%s\n' "$branches" | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "Copy the exact branch names into the workflow inputs."
          } >> "$GITHUB_STEP_SUMMARY"

          json="$(printf '%s\n' "$branches" | jq -R . | jq -s -c .)"
          echo "branches=$json" >> "$GITHUB_OUTPUT"

  transfer-commit:
    name: Validate and cherry-pick commit
    needs: list-branches
    runs-on: ubuntu-latest

    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CONFIRM_MAIN: ${{ inputs.confirm_main }}
      AVAILABLE_BRANCHES: ${{ needs.list-branches.outputs.branches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate inputs and branch names
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "::error::Source and target branches must be different."
            exit 1
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Enter a full 40-character commit SHA."
            exit 1
          fi

          if ! jq -e --arg b "$SOURCE_BRANCH" \
            'index($b) != null' <<< "$AVAILABLE_BRANCHES" >/dev/null; then
            echo "::error::Source branch does not exist in the discovered branch list."
            exit 1
          fi

          if ! jq -e --arg b "$TARGET_BRANCH" \
            'index($b) != null' <<< "$AVAILABLE_BRANCHES" >/dev/null; then
            echo "::error::Target branch does not exist in the discovered branch list."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" == "main" && "$CONFIRM_MAIN" != "true" ]]; then
            echo "::error::Confirm direct transfer to main before continuing."
            exit 1
          fi

          echo "Input validation passed."

      - name: Fetch branches and verify commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          if ! git cat-file -e "${COMMIT_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit was not found in the fetched repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "$COMMIT_SHA" "refs/remotes/origin/${SOURCE_BRANCH}"; then
            echo "::error::Commit is not in the source branch history."
            exit 1
          fi

          echo "Commit verified."
          git show --no-patch --format=fuller "$COMMIT_SHA"

      - name: Create temporary branch from target
        shell: bash
        run: |
          set -euo pipefail

          TEMP_BRANCH="automation/commit-transfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "$TEMP_BRANCH" \
            "refs/remotes/origin/${TARGET_BRANCH}"

          echo "TEMP_BRANCH=$TEMP_BRANCH" >> "$GITHUB_ENV"

      - name: Cherry-pick regular or merge commit
        shell: bash
        run: |
          set -euo pipefail

          # Count parents: one parent means a regular commit;
          # two or more parents means a merge commit.
          PARENT_COUNT="$(git rev-list --parents -n 1 "$COMMIT_SHA" | awk '{print NF-1}')"

          if [[ "$PARENT_COUNT" -eq 1 ]]; then
            echo "Regular commit detected."
            if ! git cherry-pick "$COMMIT_SHA"; then
              git cherry-pick --abort >/dev/null 2>&1 || true
              echo "::error::Cherry-pick failed. No changes were pushed."
              exit 1
            fi

          elif [[ "$PARENT_COUNT" -gt 1 ]]; then
            echo "Merge commit detected with ${PARENT_COUNT} parents."
            echo "Using mainline parent 1."

            if ! git cherry-pick -m 1 "$COMMIT_SHA"; then
              git cherry-pick --abort >/dev/null 2>&1 || true
              echo "::error::Merge cherry-pick failed. No changes were pushed."
              exit 1
            fi

          else
            echo "::error::Could not determine commit parent count."
            exit 1
          fi

          echo "Cherry-pick completed successfully."

      - name: Check resulting commit
        shell: bash
        run: |
          set -euo pipefail

          git diff-tree --check HEAD^ HEAD

          echo "New commit:"
          git log -1 --format='%H%n%s'

      - name: Push to target without force
        shell: bash
        run: |
          set -euo pipefail

          # Never force-push. Concurrent target changes or branch protection
          # may cause the push to fail safely.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "Successfully pushed to ${TARGET_BRANCH}."

      - name: Write transfer summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Commit transfer successful"
            echo
            echo "- **Repository:** \`${GITHUB_REPOSITORY}\`"
            echo "- **Source:** \`${SOURCE_BRANCH}\`"
            echo "- **Target:** \`${TARGET_BRANCH}\`"
            echo "- **Original commit:** \`${COMMIT_SHA}\`"
            echo "- **Transferred commit:** \`$(git rev-parse HEAD)\`"
            echo
            echo "Only the selected commit was cherry-picked; the source branch was not merged wholesale."
          } >> "$GITHUB_STEP_SUMMARY"
