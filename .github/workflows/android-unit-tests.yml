name: Android Unit Tests

# GeneralsX @build Android CI 06/11/2026 A Java-and-resources job for the Android launcher.
#
# It deliberately builds no native code: no `cmake --preset android-vulkan`, no `cmake --build`,
# no vcpkg bootstrap, no DXVK, and none of build-android-zh.sh / build-dual-hz.sh /
# package-android-zh.sh (which need the CMake-built .so set). It compiles the launcher's Java,
# runs lint, checks the translation resources, and packages a launcher-only APK whose every
# native library is excluded -- the whole point being that the Setup screen and the rest of the
# UI do not depend on the engine.
#
# GeneralsX @build Android CI 06/11/2026 The `testDebugUnitTest` step was removed at the
# repository owner's request (06/11/2026). The JVM tests are still run locally before a push,
# which is what AGENTS.md asks for; keeping them here as well only added a second place for the
# same result to go red. The workflow's name is left as-is so existing run history and any
# branch-protection reference to "Android Unit Tests" keep resolving to this job.
#
# SDL3's Java glue is fetched straight from the SDL3 release tarball by
# scripts/build/android/stage-sdl-java.sh, so the Java shell still matches the version the game
# links without configuring CMake to get it.
#
# Compared with the full Android build this is minutes rather than tens of minutes, and it is the
# job that should run on every launcher change.

permissions:
  contents: read

on:
  # GeneralsX @build Android CI 06/11/2026 Manual dispatch and a pull-request trigger scoped to
  # the launcher's own paths. No push: trigger -- the repository owner builds locally and pushes
  # to both main and the working branch on every commit, and AGENTS.md asks for local builds only
  # (a push trigger would start two unattended runs per commit). See build-android.yml for the
  # same decision and its reasoning.
  workflow_dispatch:

  pull_request:
    branches:
      - main
      # New-app is the integration branch PRs actually land on (PRs #3 and #4 both
      # targeted it). Without it here, a PR to New-app does not run this job at all,
      # which is how the first broken revision reached New-app unreviewed by CI.
      - New-app
    paths:
      - 'android/**'
      - 'scripts/build/android/stage-sdl-java.sh'
      # The translation checker the job runs; a change to it should re-run the check.
      - 'scripts/qa/android/**'
      # stage-sdl-java.sh reads SDL3_VERSION and SDL3_URL_HASH from here, so bumping SDL3
      # changes the Java shell this job builds against.
      - 'cmake/sdl3.cmake'
      - '.github/workflows/android-unit-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launcher:
    name: launcher tests + lint + APK
    runs-on: ubuntu-latest
    # Generous, but this job has no native compile in it: a cold run is dominated by the Gradle
    # dependency download, which the cache below removes after the first run.
    timeout-minutes: 45

    env:
      # GeneralsX @build Android CI 06/11/2026 Pinned to match build-android.yml, so a launcher
      # that builds here builds there. Do not float these.
      GRADLE_VERSION: "8.9"
      JAVA_VERSION: "17"
      COMPILE_SDK: "35"
      BUILD_TOOLS: "35.0.0"
      # cmdline-tools zip, pinned and checksummed exactly as build-android.yml does. Only
      # platform + build-tools are installed below -- no NDK, because nothing here compiles C++.
      CMDLINE_TOOLS_VERSION: "13114758"
      CMDLINE_TOOLS_SHA1: "5fdcc763663eefb86a5b8879697aa6088b041e70"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # The launcher job needs the working tree only; no history and no submodules (the DXVK
          # submodule is a native dependency and is not touched here).
          fetch-depth: 1
          submodules: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # GeneralsX @build Android CI 06/11/2026 Restore/save are an explicit pair here rather than
      # plain actions/cache, for the reason build-android.yml gives: actions/cache's automatic
      # post-step save runs only when the job succeeded, and this cache matters most on a red run
      # -- that is the run you re-run. The key carries no NDK component because this job installs
      # no NDK, so it can never collide with build-android.yml's SDK cache, whose contents differ.
      - name: Restore Android SDK cache
        id: cache-android-sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-p${{ env.COMPILE_SDK }}-bt${{ env.BUILD_TOOLS }}

      # GeneralsX @build Android CI 06/11/2026 Installs the SDK platform and build-tools the
      # Gradle build needs and nothing else: no NDK, no CMake, no vcpkg. The versions match
      # android/app/build.gradle (compileSdk 35) and build-android.yml.
      - name: Install Android SDK (cmdline-tools + platform + build-tools)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          echo "${CMDLINE_TOOLS_SHA1}  /tmp/cmdline-tools.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          # sdkmanager requires the "<sdk>/cmdline-tools/latest" layout to locate its SDK root.
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          # sdkmanager and the later Gradle run write into the SDK, so hand it to this user rather
          # than leave it root-owned (build-android.yml does the same).
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          rm /tmp/cmdline-tools.zip
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          # `|| true` is load-bearing, not decoration: sdkmanager exits as soon as it has read the
          # answers it needs, and `yes` then dies of SIGPIPE (141). Under `set -o pipefail` that
          # non-zero status becomes the pipeline's, and with `set -e` it aborts the step -- which
          # is exactly how this job first failed. build-android.yml carries the same `|| true`.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" "platform-tools"

      # GeneralsX @build Android CI 06/11/2026 Exported in its own always-run step, not inside the
      # install above: on a cache hit that step is skipped, and these two variables are what the
      # Gradle steps need to find the SDK at all. build-android.yml splits it for the same reason.
      - name: Export Android SDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          test -x "/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            || { echo "::error::sdkmanager missing after restore/install"; exit 1; }
          test -d "/opt/android-sdk/platforms/android-${COMPILE_SDK}" \
            || { echo "::error::platform android-${COMPILE_SDK} missing after restore/install"; exit 1; }

      # GeneralsX @build Android CI 06/11/2026 The SDL3 release tarball (~40 MB, and the step below
      # runs with --force so it is fetched on every run). Cached under a key derived from
      # cmake/sdl3.cmake, the same source of truth stage-sdl-java.sh reads its version and SHA256
      # from, so bumping SDL3 changes the key and the new tarball is fetched. The script verifies
      # the SHA256 of whatever it finds, cached or downloaded, so a poisoned cache cannot pass.
      - name: Restore SDL3 tarball cache
        id: cache-sdl3-tarball
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/generalsx/sdl3
          key: sdl3-tarball-${{ hashFiles('cmake/sdl3.cmake') }}

      # gradle/actions/setup-gradle puts the requested Gradle on PATH and caches both the Gradle
      # distribution and ~/.gradle/caches, which is what keeps this job short on a warm cache.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # GeneralsX @build Android CI 06/11/2026 The launcher's Java compiles against SDL3's Java
      # glue, which is gitignored (it is SDL's code, staged at build time). This fetches it from
      # the SDL3 release tarball and applies android/patches/*.patch -- the same files, same
      # patches, same version package-android-zh.sh stages from the CMake tree -- without
      # configuring or building CMake.
      - name: Stage SDL3 Java glue
        # SDL3_TARBALL_CACHE is set here rather than as an `env:` value on purpose: a `~` or `$HOME`
        # in a step's env is passed through literally (the shell does not expand a variable's value),
        # so the directory has to be built in the shell for `~` to mean the runner's home. The cache
        # action's own `path:` above does expand `~`, so the two agree on the directory.
        run: SDL3_TARBALL_CACHE="$HOME/.cache/generalsx/sdl3" ./scripts/build/android/stage-sdl-java.sh --force

      # GeneralsX @build Android CI 06/11/2026 Lint is its own step so a lint failure is visible as
      # such rather than as "the build failed". It needs no native compilation: the only findings
      # that were aborting it were in SDL's own staged Java, and those are scoped out by path in
      # android/app/lint.xml.
      - name: Run Android Lint
        working-directory: android
        run: gradle :app:lintDebug --no-daemon --console=plain

      # GeneralsX @build Android CI 06/11/2026 The translation rules AGENTS.md asks for, checked
      # as a script over res/values*/strings.xml: every locale declares the same string names as
      # values/, no translation is empty where English has text, and no printf argument was
      # dropped or reordered. The same rules are also asserted by TranslationResourceTest in the
      # JVM suite, which now runs locally only; this step is the CI-side check and does not depend
      # on the JVM run.
      - name: Validate translations and XML resources
        run: python3 scripts/qa/android/check-translations.py

      # GeneralsX @build Android CI 06/11/2026 The launcher-only APK: the production launcher with
      # every native library excluded (androidComponents in android/app/build.gradle). It is built
      # from the same Java, resources, assets and translations as the real APK, so it is what a
      # tester installs to exercise the UI -- and its emptiness of .so files is asserted below.
      - name: Build launcher-only APK
        working-directory: android
        run: gradle :app:assembleLauncherOnly --no-daemon --console=plain

      # GeneralsX @build Android CI 06/11/2026 The APK's whole claim is that it has no engine. If a
      # .so ever appears in it the build is wrong, so this fails rather than shipping it. python3
      # reads the zip directly -- no unzip/aapt2 dependency, and the listing is unambiguous.
      - name: Assert the launcher APK contains no native libraries
        run: |
          python3 - <<'PY'
          import sys, zipfile
          apk = "android/app/build/outputs/apk/launcherOnly/app-launcherOnly.apk"
          names = zipfile.ZipFile(apk).namelist()
          native = sorted(n for n in names if n.endswith(".so"))
          if native:
              print("::error::the launcher-only APK contains native libraries: " + ", ".join(native))
              sys.exit(1)
          assert "classes.dex" in names, "the APK has no classes.dex"
          print("Launcher-only APK: %d entries, 0 native libraries, classes.dex present." % len(names))
          PY

      # GeneralsX @build Android R8 protection 14/11/2026 The release variant is the one that
      # ships obfuscated (android/app/build.gradle: minifyEnabled true, shrinkResources true).
      # Building it here is what proves R8 actually runs end to end -- a green debug build says
      # nothing about it, because debug is deliberately unminified. AGP fails this task on any
      # R8 error, a missing class, a duplicate class or a resource-shrinking error, so a
      # successful exit is itself the check for all four; the step after it asserts the output.
      - name: Build R8-protected release APK and AAB
        working-directory: android
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --console=plain

      # GeneralsX @build Android R8 protection 14/11/2026 Verify what R8 produced, not just that
      # it exited 0: that the mapping was generated, that the launcher's non-entry-point classes
      # were really obfuscated (a keep rule that widened to a package would show up only here),
      # that every JNI-bound class and method name survived (the native half names them as
      # strings, so a rename is invisible until the app dies on device), that the shrinker kept
      # the colours ThemeHelper resolves by name, and that the signing certificate and package
      # identity are unchanged. See scripts/qa/android/check-r8-protection.py.
      - name: Verify R8 protection
        env:
          APKSIGNER: /opt/android-sdk/build-tools/${{ env.BUILD_TOOLS }}/apksigner
          AAPT2: /opt/android-sdk/build-tools/${{ env.BUILD_TOOLS }}/aapt2
        run: python3 scripts/qa/android/check-r8-protection.py

      # GeneralsX @build Android R8 protection 14/11/2026 The release APK and AAB carry the
      # obfuscated launcher; upload them so a reviewer can install the protected build without
      # rebuilding it.
      - name: Upload release APK and AAB
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-release-r8
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      # GeneralsX @build Android R8 protection 14/11/2026 mapping.txt is what turns an obfuscated
      # stack trace back into a readable one, so it must be kept -- but it is also a complete map
      # of the app's internals, so it must not travel with the APK. It is uploaded on its own,
      # under its own name, never into the release artifact above, and never as a release asset
      # or a committed file. This repository is private, so an Actions artifact is readable only
      # to people who already have repository access; that is the access restriction. A shorter
      # retention than the APK keeps the map from lingering after the build it describes is gone.
      - name: Upload R8 mapping file (restricted)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-release
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      # GeneralsX @build Android CI 06/11/2026 `if: always()`, so a failing lint run still leaves
      # its report behind -- the report is the thing you need when the step above went red. The
      # unit-test report paths that used to be listed here were dropped along with the
      # `testDebugUnitTest` step; only the lint report is still produced.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload launcher-only APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-only-apk
          path: android/app/build/outputs/apk/launcherOnly/*.apk
          if-no-files-found: warn
          retention-days: 14

      # GeneralsX @build Android CI 06/11/2026 Caches are saved even when the job failed, and in
      # their own always-run steps rather than through plain actions/cache, which saves only on a
      # successful job. build-android.yml uses the same explicit pair for the same reason: the run
      # whose cache you most want is the red one you are about to re-run. Each save is guarded on
      # its restore having missed, so a run that restored an exact-key hit does not try to re-save
      # an unchanged entry.
      - name: Save Android SDK cache
        if: always() && steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-p${{ env.COMPILE_SDK }}-bt${{ env.BUILD_TOOLS }}

      - name: Save SDL3 tarball cache
        if: always() && steps.cache-sdl3-tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/generalsx/sdl3
          key: sdl3-tarball-${{ hashFiles('cmake/sdl3.cmake') }}
