
name: Download, Compress and Upload Artifact

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Direct download URL or mirror URL"
        required: true
        type: string

      archive_name:
        description: "Optional output archive name without .7z"
        required: false
        default: ""
        type: string

      retention_days:
        description: "Artifact retention days (1-90)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  download-compress:
    name: Download, Compress and Upload
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item work, release -Recurse -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force work | Out-Null
          New-Item -ItemType Directory -Force release | Out-Null

      - name: Validate inputs
        shell: pwsh
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
          ARCHIVE_INPUT: ${{ inputs.archive_name }}
          RETENTION: ${{ inputs.retention_days }}
        run: |
          $ErrorActionPreference = "Stop"

          $uri = $null
          if (-not [System.Uri]::TryCreate(
              $env:DOWNLOAD_URL,
              [System.UriKind]::Absolute,
              [ref]$uri
          )) {
              throw "Invalid download URL."
          }

          if ($uri.Scheme -notin @("http", "https")) {
              throw "Only HTTP and HTTPS URLs are supported."
          }

          if ([string]::IsNullOrWhiteSpace($env:ARCHIVE_INPUT) -eq $false) {
              if ($env:ARCHIVE_INPUT -notmatch '^[a-zA-Z0-9._-]+$') {
                  throw "Archive name contains invalid characters."
              }

              if ($env:ARCHIVE_INPUT -in @(".", "..")) {
                  throw "Invalid archive name."
              }
          }

          $days = 0
          if (-not [int]::TryParse($env:RETENTION, [ref]$days) -or
              $days -lt 1 -or $days -gt 90) {
              throw "Retention must be between 1 and 90 days."
          }

          Write-Host "Inputs validated."

      - name: Download file from mirror
        shell: pwsh
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $url = $env:DOWNLOAD_URL
          $output = "work\downloaded.file"

          $headers = @{
              "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
              "Accept" = "*/*"
          }

          Write-Host "Downloading from the supplied URL..."

          try {
              Invoke-WebRequest `
                  -Uri $url `
                  -Headers $headers `
                  -MaximumRedirection 20 `
                  -UseBasicParsing `
                  -OutFile $output
          }
          catch {
              Write-Host "Download failed:"
              Write-Host $_.Exception.Message
              throw
          }

          if (!(Test-Path $output)) {
              throw "Download did not create a file."
          }

          $file = Get-Item $output

          if ($file.Length -le 0) {
              throw "Downloaded file is empty."
          }

          Write-Host "Download successful."
          Write-Host "Size: $($file.Length) bytes"

      - name: Detect original filename
        shell: pwsh
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
          ARCHIVE_INPUT: ${{ inputs.archive_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $url = $env:DOWNLOAD_URL
          $filename = $null

          # Prefer the server's Content-Disposition header.
          try {
              $head = Invoke-WebRequest `
                  -Uri $url `
                  -Method Head `
                  -Headers @{
                      "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
                      "Accept" = "*/*"
                  } `
                  -MaximumRedirection 20 `
                  -UseBasicParsing

              $cd = $head.Headers["Content-Disposition"]

              if ($cd -match "filename\*\s*=\s*UTF-8''([^;]+)") {
                  $filename = [System.Uri]::UnescapeDataString(
                      $Matches[1].Trim('"')
                  )
              }
              elseif ($cd -match 'filename\s*=\s*"?([^";]+)') {
                  $filename = $Matches[1].Trim()
              }
          }
          catch {
              Write-Host "HEAD unavailable; trying the URL filename."
          }

          if ([string]::IsNullOrWhiteSpace($filename)) {
              try {
                  $uri = [System.Uri]$url
                  $filename = [System.IO.Path]::GetFileName(
                      $uri.AbsolutePath
                  )
                  $filename = [System.Uri]::UnescapeDataString($filename)
              }
              catch {
                  $filename = $null
              }
          }

          if ([string]::IsNullOrWhiteSpace($filename)) {
              $filename = "downloaded-file"
          }

          $filename = [System.IO.Path]::GetFileName($filename)

          $filename = $filename -replace '[<>:"/\\|?*\x00-\x1F]', '_'
          $filename = $filename.TrimEnd('.', ' ')

          if ([string]::IsNullOrWhiteSpace($filename) -or
              $filename -in @(".", "..")) {
              $filename = "downloaded-file"
          }

          $destination = Join-Path "work" $filename

          Move-Item -Path "work\downloaded.file" `
              -Destination $destination -Force

          $file = Get-Item $destination

          "FILE_NAME=$filename" >> $env:GITHUB_ENV
          "FILE_PATH=$destination" >> $env:GITHUB_ENV
          "FILE_SIZE=$($file.Length)" >> $env:GITHUB_ENV

          Write-Host "Detected filename: $filename"
          Write-Host "Size: $($file.Length) bytes"

          # Use a custom archive name if provided; otherwise
          # remove the original extension.
          $base = $env:ARCHIVE_INPUT

          if ([string]::IsNullOrWhiteSpace($base)) {
              $base = [System.IO.Path]::GetFileNameWithoutExtension(
                  $filename
              )
          }

          $base = $base -replace '\.7z$', ''

          if ([string]::IsNullOrWhiteSpace($base) -or
              $base -in @(".", "..")) {
              $base = "downloaded-file"
          }

          "ARCHIVE_BASE=$base" >> $env:GITHUB_ENV

      - name: Locate or install 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
              "$env:ProgramFiles\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe",
              "C:\ProgramData\chocolatey\bin\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $candidates) {
              if ($path -and (Test-Path $path)) {
                  $sevenZip = $path
                  break
              }
          }

          if (-not $sevenZip) {
              choco install 7zip -y --no-progress

              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip installation failed."
              }

              foreach ($path in $candidates) {
                  if ($path -and (Test-Path $path)) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              $cmd = Get-Command 7z.exe -ErrorAction SilentlyContinue
              if ($cmd) {
                  $sevenZip = $cmd.Source
              }
          }

          if (-not $sevenZip) {
              throw "Could not locate 7-Zip."
          }

          "SEVENZIP=$sevenZip" >> $env:GITHUB_ENV

          Write-Host "Using: $sevenZip"
          & $sevenZip i

          if ($LASTEXITCODE -ne 0) {
              throw "7-Zip verification failed."
          }

      - name: Compress with maximum 7-Zip settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "release\$env:ARCHIVE_BASE.7z"

          Write-Host "Compression: Ultra / Level 9"
          Write-Host "Method: LZMA2"
          Write-Host "Dictionary: 64 MB"
          Write-Host "Fast bytes: 273"
          Write-Host "Solid mode: enabled"
          Write-Host "Multithreading: enabled"

          & "$env:SEVENZIP" a `
              "-t7z" `
              "-mx=9" `
              "-m0=lzma2" `
              "-mfb=273" `
              "-md=64m" `
              "-ms=on" `
              "-mmt=on" `
              "-y" `
              "$archive" `
              "$env:FILE_PATH"

          if ($LASTEXITCODE -ne 0) {
              throw "Compression failed: exit code $LASTEXITCODE"
          }

          if (!(Test-Path $archive)) {
              throw "Archive was not created."
          }

          $item = Get-Item $archive
          if ($item.Length -le 0) {
              throw "Archive is empty."
          }

          "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          "ARCHIVE_SIZE=$($item.Length)" >> $env:GITHUB_ENV

          Write-Host "Archive created: $archive"
          Write-Host "Compressed size: $($item.Length) bytes"

      - name: Verify 7-Zip archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:SEVENZIP" t "$env:ARCHIVE_PATH"

          if ($LASTEXITCODE -ne 0) {
              throw "Archive verification failed."
          }

          Write-Host "Archive integrity verified."

      - name: Generate SHA-256 and report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $original = Get-Item "$env:FILE_PATH"
          $archive = Get-Item "$env:ARCHIVE_PATH"

          $originalHash = (
              Get-FileHash $original.FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $archiveHash = (
              Get-FileHash $archive.FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $shaPath = "$env:ARCHIVE_PATH.sha256"

          "$archiveHash *$($archive.Name)" |
              Set-Content -Path $shaPath -Encoding ascii

          $saved = $original.Length - $archive.Length
          $ratio = [math]::Round(
              ($archive.Length / $original.Length) * 100, 2
          )

          $reduction = [math]::Round(
              (1 - ($archive.Length / $original.Length)) * 100, 2
          )

          @"
          Original file: $($original.Name)
          Original size: $($original.Length) bytes
          Original SHA-256: $originalHash

          Archive: $($archive.Name)
          Archive size: $($archive.Length) bytes
          Archive SHA-256: $archiveHash

          Archive/original ratio: $ratio%
          Size reduction: $reduction%
          Bytes saved: $saved
          "@ | Set-Content "release\REPORT.txt" -Encoding utf8

          Get-Content "release\REPORT.txt"

      - name: Upload 7z Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.archive_name != '' && inputs.archive_name || '7z-archive' }}-${{ github.run_number }}
          path: |
            release/*.7z
            release/*.sha256
            release/REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
