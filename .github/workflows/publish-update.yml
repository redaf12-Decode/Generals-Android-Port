# GeneralsX @feature Android security 10/11/2026
#
# Generate and publish the launcher's update metadata (update.json + update.json.sig) from the
# APK that was actually released, so the two can never disagree. The launcher verifies
# update.json.sig against a public key pinned in UpdateChecker.PUBLIC_KEY_B64 before it trusts a
# single field of update.json, so an unsigned or placeholder file is refused by the app as well.
#
# The metadata-signing private key (UPDATE_METADATA_SIGNING_KEY, a PEM ECDSA P-256 key) is a
# GitHub Actions secret and never enters the repository. To rotate it, replace the secret and the
# pinned public key in UpdateChecker in the same change.
#
# Manual only. Point it at the release APK's download URL after a release is published.
name: Publish update metadata

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.5.0 (must match the APK's own versionName)"
        required: true
        type: string
      version_code:
        description: "Version code, e.g. 10500 (must match the APK's own versionCode)"
        required: true
        type: string
      apk_url:
        description: "HTTPS URL of the released APK (a GitHub Release asset)"
        required: true
        type: string
      notes_file:
        description: "Path in the repo to release notes (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only this job commits; the workflow default stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout New-app
        uses: actions/checkout@v6
        with:
          ref: New-app
          fetch-depth: 1

      - name: Download the released APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          case "${APK_URL}" in
            https://github.com/*|https://*.githubusercontent.com/*) ;;
            *) echo "::error::apk_url must be an https:// GitHub URL"; exit 1 ;;
          esac
          curl -fL --retry 3 -o /tmp/app-release.apk "${APK_URL}"
          test -s /tmp/app-release.apk || { echo "::error::downloaded APK is empty"; exit 1; }

      - name: Generate and sign update.json
        env:
          UPDATE_METADATA_SIGNING_KEY: ${{ secrets.UPDATE_METADATA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_METADATA_SIGNING_KEY}" ]; then
            echo "::error::UPDATE_METADATA_SIGNING_KEY is not set; refusing to publish unsigned metadata."
            exit 1
          fi
          umask 077
          printf '%s\n' "${UPDATE_METADATA_SIGNING_KEY}" > "$RUNNER_TEMP/metadata-key.pem"
          NOTES_ARG=""
          if [ -n "${{ inputs.notes_file }}" ]; then
            NOTES_ARG="--notes-file ${{ inputs.notes_file }}"
          fi
          python3 scripts/update/generate-update-json.py \
            --apk /tmp/app-release.apk \
            --version-name "${{ inputs.version_name }}" \
            --version-code "${{ inputs.version_code }}" \
            --package-name com.ports.generalsx \
            --url "${{ inputs.apk_url }}" \
            --out-dir . \
            $NOTES_ARG \
            --sign-key "$RUNNER_TEMP/metadata-key.pem"
          rm -f "$RUNNER_TEMP/metadata-key.pem"

      - name: Verify the signature against the pinned metadata key
        # GeneralsX @feature Android security 12/11/2026 update.json.sig is only useful if it
        # verifies against UpdateChecker.PUBLIC_KEY_B64. A secret that has drifted from the pinned
        # anchor would publish metadata every launcher rejects; catch it here. The pinned key is
        # read from source so a half-done rotation cannot publish.
        run: |
          set -euo pipefail
          python3 scripts/qa/android/print-pinned-key.py metadata > "$RUNNER_TEMP/meta.pub.pem"
          base64 -d update.json.sig > "$RUNNER_TEMP/update.sig"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/meta.pub.pem" \
            -signature "$RUNNER_TEMP/update.sig" update.json
          rm -f "$RUNNER_TEMP/meta.pub.pem" "$RUNNER_TEMP/update.sig"

      - name: Reject placeholder or inconsistent metadata
        # The exact failure the launcher used to be shipped with: an all-zero sha256 and a zero
        # size. Fail the publish rather than commit them.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys
          doc = json.load(open("update.json"))
          sha = doc.get("apkSha256", "")
          size = doc.get("apkSizeBytes", 0)
          if not re.fullmatch(r"[0-9a-f]{64}", sha) or set(sha) == {"0"}:
              sys.exit("::error::update.json has a missing or placeholder apkSha256")
          if not isinstance(size, int) or size <= 0:
              sys.exit("::error::update.json has a zero or non-integer apkSizeBytes")
          if not str(doc.get("apkUrl", "")).startswith("https://github.com/"):
              sys.exit("::error::update.json apkUrl is not a GitHub https URL")
          assert open("update.json.sig").read().strip(), "update.json.sig is empty"
          print("update.json: versionCode=%s size=%d sha256=%s" % (doc["versionCode"], size, sha))
          PY

      - name: Commit and push the metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json update.json.sig
          if git diff --cached --quiet; then
            echo "update.json is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(android): publish signed update.json for ${{ inputs.version_name }}"
          git push origin HEAD:New-app
