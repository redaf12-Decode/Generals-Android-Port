# GeneralsX @feature Android port 27/09/2026 Sign the manifest on the `updates` branch with the
# key kept in the repository secret UPDATE_SIGNING_KEY (PEM, ECDSA P-256), so the key never has
# to be in a clone. Manual only, and it only signs: a run takes seconds. See
# docs/HOWTO/PUBLISH_UPDATE.md.
name: Sign update

on:
  workflow_dispatch:
    inputs:
      branch:
        # GeneralsX @feature Android port 18/10/2026 updates-test: the test builds' channel.
        description: "Branch to sign: updates (releases) or updates-test (test builds)"
        type: choice
        options: [updates, updates-test]
        default: updates

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'updates' }}
          fetch-depth: 1
      - name: Sign manifest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "UPDATE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" manifest.json | base64 -w0 > manifest.json.sig
          echo >> manifest.json.sig
          rm -f "$RUNNER_TEMP/key.pem"
      # GeneralsX @feature Android security 12/11/2026 The signature is only useful if it verifies
      # against the key the launcher and the engine actually pin. Sign with a secret that has
      # drifted from UpdateManager.PUBLIC_KEY_B64 and every device would reject the manifest; fail
      # here instead of publishing it. The pinned key is read from source, so a rotation that
      # updated one but not the other cannot slip through.
      - name: Verify the signature against the pinned engine-update key
        run: |
          set -euo pipefail
          python3 scripts/qa/android/print-pinned-key.py engine > "$RUNNER_TEMP/engine.pub.pem"
          base64 -d manifest.json.sig > "$RUNNER_TEMP/manifest.sig"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/engine.pub.pem" \
            -signature "$RUNNER_TEMP/manifest.sig" manifest.json
          rm -f "$RUNNER_TEMP/engine.pub.pem" "$RUNNER_TEMP/manifest.sig"
      - name: Replace the branch's single commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json.sig
          git commit --amend --no-edit
          git push --force origin "HEAD:${{ inputs.branch || 'updates' }}"
